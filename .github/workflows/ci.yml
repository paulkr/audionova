# CI runs `ci/run.sh` and nothing else.
#
# Every stage lives in that script rather than in this file, so "it passes
# locally" and "it passes in CI" cannot diverge. A workflow that reimplements
# the steps is a second definition of correct, and the two drift the first time
# somebody fixes one of them.
#
# Same reasoning that keeps the Python side shelling out to the engine binary
# that ships rather than binding it in-process.

name: CI

# PAUSED, DELIBERATELY, AND NOT BECAUSE IT WAS FAILING.
#
# Hosted runners bill by the minute and macOS bills at 10x, so this matrix is
# not free while the product is still local-only. Until there is something
# deployed that a green tick protects, `ci/run.sh` on a developer machine is the
# gate — it is the same script, which is the whole reason CI never had steps of
# its own.
#
# To bring it back: restore the `push` and `pull_request` triggers below. Do
# that before anything ships, because of what only this can check —
#
# THE CROSS-ARCHITECTURE CLAIM IS UNVERIFIABLE LOCALLY. The engine's contract is
# bit-exact within one (engine_version, arch) and -170 dBFS RMS across them, and
# `ci/check_golden.py` tests that transitively by having both architectures
# compare against one committed render. With only arm64 available, the x86-64
# half of that is untested, and the last measurement said most of the engine is
# bit-identical across the two with the limiter's gain reduction the sole
# exception. That result is now provisional until this runs again.
on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # BOTH ARCHITECTURES, DELIBERATELY. The engine's contract is bit-exact
        # within (engine_version, arch) and -140 dBFS across them, and that
        # threshold was chosen because libm ULP differences and SIMD summation
        # order make bit-exactness across x86 and ARM a losing fight.
        #
        # Everything has only ever run on one machine, so that reasoning has
        # never actually been tested. Running both is the only way to find out
        # whether -140 dB is right, too tight, or too generous.
        include:
          - os: ubuntu-latest     # x86-64
          - os: macos-latest      # arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create the virtual environment
        run: |
          python -m venv .venv
          # Pinned to what the licence lock approved, pip included. Unpinned,
          # a fresh resolve pulls dependencies the lock has never seen and the
          # licence gate fails, correctly, on the first run.
          .venv/bin/pip install --quiet -c backend/constraints.txt pip
          .venv/bin/pip install --quiet -r backend/requirements.txt -c backend/constraints.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install the frontend's dependencies
        run: npm ci

      - name: Run the pipeline
        run: ci/run.sh

      # The stems are gitignored — their licence status is the user's to decide,
      # not something a commit should assume. Suites needing them skip cleanly,
      # and say so rather than reporting a smaller check count silently.
      - name: Note which suites ran without real audio
        if: always()
        run: |
          echo "audio/stems is gitignored; stem-dependent assertions skip in CI."
          echo "Run ci/run.sh locally with stems present for full coverage."
