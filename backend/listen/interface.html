<!doctype html>
<!--
  The listening-test interface.

  GAPLESS SWITCHING IS THE ONLY HARD REQUIREMENT IN HERE. A gap between A and B
  lets auditory memory fill in the difference, and auditory memory is generous:
  across even a few hundred milliseconds of silence a listener reliably "hears"
  the difference they expected. So all three clips are decoded up front, started
  together on one clock, and left running in lockstep for the whole trial. There
  is no seeking, no re-decoding and no restart when the listener switches —
  switching moves gain, and nothing else moves at all.

  The 8 ms ramp on that gain is not a crossfade of the material; it is there
  because an instantaneous gain step is a discontinuity, and a discontinuity is
  a click, and a click is a difference the listener would attribute to the
  audio. Eight milliseconds is short enough that no useful information survives
  in the overlap and long enough that nothing snaps.

  Nothing in this file knows what a condition is. It receives opaque clip
  identifiers and posts back opaque trial identifiers.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audionova listening test</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2027; --line: #2c313b;
    --ink: #e8eaee; --dim: #949aa6; --accent: #6ea8ff; --good: #63c98b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 780px; margin: 0 auto; padding: 28px 20px 80px; }
  h1 { font-size: 19px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 22px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px; margin-bottom: 16px;
  }
  .request { font-size: 17px; line-height: 1.4; }
  .request em { color: var(--accent); font-style: normal; }
  .switch { display: flex; gap: 10px; margin: 18px 0 12px; }
  .switch button {
    flex: 1; padding: 18px 0; font-size: 20px; font-weight: 600;
    background: #262a33; color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; cursor: pointer;
  }
  .switch button.on { background: var(--accent); color: #10131a; border-color: var(--accent); }
  .switch button.ref { flex: 0 0 130px; font-size: 14px; font-weight: 500; }
  .transport { display: flex; align-items: center; gap: 12px; }
  .transport button {
    width: 74px; padding: 8px 0; background: #262a33; color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
  }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .time { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 13px; min-width: 84px; }
  .scale { margin: 14px 0; }
  .scale .q { font-size: 14px; color: var(--dim); margin-bottom: 6px; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .row .who { width: 26px; font-weight: 600; }
  .opts { display: flex; gap: 6px; flex: 1; }
  .opts button {
    flex: 1; padding: 8px 0; background: #262a33; color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .opts button.on { background: var(--accent); color: #10131a; border-color: var(--accent); }
  .pref .opts button.on { background: var(--good); border-color: var(--good); }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .foot button {
    padding: 12px 26px; font-size: 15px; font-weight: 600; border-radius: 8px;
    background: var(--accent); color: #10131a; border: none; cursor: pointer;
  }
  .foot button[disabled] { background: #363b46; color: var(--dim); cursor: not-allowed; }
  .hint { color: var(--dim); font-size: 12px; }
  select, .listener-list button {
    background: #262a33; color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 10px 14px; font-size: 15px; cursor: pointer;
  }
  .listener-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .err { color: #ff8f8f; }
</style>
</head>
<body>
<main>
  <h1>Audionova listening test</h1>
  <div class="sub" id="sub">loading&hellip;</div>
  <div id="root"></div>
</main>

<script>
"use strict";

const state = {
  listener: null,
  trials: [],
  scales: [],
  index: 0,
  answers: new Map(),   // trial_id -> {preference, ratings:{A:{},B:{}}}
  buffers: null,        // {A,B,reference}
  ctx: null,
  nodes: null,          // {sources, gains}
  active: "A",
  playing: false,
  startedAt: 0,
  offset: 0,
  duration: 0,
};

const root = document.getElementById("root");
const sub = document.getElementById("sub");

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (value !== null && value !== false) node.setAttribute(key, value);
  }
  for (const child of (children || [])) {
    node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
  }
  return node;
}

function fail(message) {
  root.replaceChildren(el("div", {class: "panel err"}, [message]));
}

// --- audio -------------------------------------------------------------------

async function loadTrial(trial) {
  stop();
  state.buffers = null;
  if (!state.ctx) state.ctx = new (window.AudioContext || window.webkitAudioContext)();
  const keys = ["A", "B", "reference"];
  const ids = [trial.clip_a, trial.clip_b, trial.reference];
  const decoded = await Promise.all(ids.map(async (id) => {
    const response = await fetch(`/clip/${id}.wav`, {cache: "no-store"});
    if (!response.ok) throw new Error(`clip ${id}: ${response.status}`);
    return state.ctx.decodeAudioData(await response.arrayBuffer());
  }));
  state.buffers = {};
  keys.forEach((key, i) => { state.buffers[key] = decoded[i]; });
  state.duration = Math.min.apply(null, decoded.map((b) => b.duration));
  state.offset = 0;
  state.active = "A";
}

// All three sources are created together, started on one clock at the same
// offset, and looped. Switching never touches them.
function start(offset) {
  if (!state.buffers) return;
  stop();
  const ctx = state.ctx;
  const sources = {}, gains = {};
  const at = ctx.currentTime + 0.06;
  for (const key of ["A", "B", "reference"]) {
    const source = ctx.createBufferSource();
    source.buffer = state.buffers[key];
    source.loop = true;
    const gain = ctx.createGain();
    gain.gain.value = (key === state.active) ? 1 : 0;
    source.connect(gain).connect(ctx.destination);
    source.start(at, offset % state.duration);
    sources[key] = source;
    gains[key] = gain;
  }
  state.nodes = {sources, gains};
  state.startedAt = at;
  state.offset = offset;
  state.playing = true;
}

function stop() {
  if (state.nodes) {
    for (const source of Object.values(state.nodes.sources)) {
      try { source.stop(); } catch (_) { /* already stopped */ }
    }
    state.nodes = null;
  }
  state.playing = false;
}

function position() {
  if (!state.duration) return 0;
  if (!state.playing) return state.offset % state.duration;
  const elapsed = Math.max(0, state.ctx.currentTime - state.startedAt);
  return (state.offset + elapsed) % state.duration;
}

// THE SWITCH. Gain only, over 8 ms, on sources that never stopped.
function select(which) {
  state.active = which;
  if (state.nodes) {
    const now = state.ctx.currentTime;
    for (const [key, gain] of Object.entries(state.nodes.gains)) {
      gain.gain.cancelScheduledValues(now);
      gain.gain.setValueAtTime(gain.gain.value, now);
      gain.gain.linearRampToValueAtTime(key === which ? 1 : 0, now + 0.008);
    }
  }
  paint();
}

function toggle() {
  if (state.playing) { const at = position(); stop(); state.offset = at; }
  else start(state.offset);
  paint();
}

function seek(seconds) {
  const wasPlaying = state.playing;
  stop();
  state.offset = seconds;
  if (wasPlaying) start(seconds);
  paint();
}

// --- answers -----------------------------------------------------------------

function answerFor(trialId) {
  if (!state.answers.has(trialId)) {
    state.answers.set(trialId, {preference: null, ratings: {A: {}, B: {}}});
  }
  return state.answers.get(trialId);
}

function complete(trialId) {
  const answer = state.answers.get(trialId);
  if (!answer || !answer.preference) return false;
  for (const side of ["A", "B"]) {
    for (const scale of state.scales) {
      if (typeof answer.ratings[side][scale.key] !== "number") return false;
    }
  }
  return true;
}

// --- rendering ---------------------------------------------------------------

let ticker = null;
let refs = {};

// The playhead moves four times a second and the ratings do not. Rebuilding
// the whole panel on every tick would throw away a click that landed between
// frames, which on a rating scale is a wrong answer nobody typed.
function tick() {
  if (!refs.slider) return;
  const at = position();
  if (document.activeElement !== refs.slider) refs.slider.value = String(at);
  refs.clock.textContent = `${at.toFixed(1)} / ${state.duration.toFixed(1)} s`;
  refs.play.textContent = state.playing ? "pause" : "play";
}

function paint() {
  const trial = state.trials[state.index];
  if (!trial) return;
  const answer = answerFor(trial.trial_id);

  const switcher = el("div", {class: "switch"}, [
    el("button", {class: state.active === "A" ? "on" : "", onclick: () => select("A")}, ["A"]),
    el("button", {class: state.active === "B" ? "on" : "", onclick: () => select("B")}, ["B"]),
    el("button", {
      class: "ref " + (state.active === "reference" ? "on" : ""),
      onclick: () => select("reference"),
    }, ["original"]),
  ]);

  // Seek on `change`, not on `input`. `input` fires continuously while the
  // thumb is dragged, and seeking restarts the sources — so dragging would
  // stutter the audio and, because a seek repaints, drop the drag itself.
  const slider = el("input", {
    type: "range", min: "0", max: String(Math.max(state.duration, 0.01)),
    step: "0.01", value: String(position()),
    oninput: (event) => {
      refs.clock.textContent =
        `${parseFloat(event.target.value).toFixed(1)} / ${state.duration.toFixed(1)} s`;
    },
    onchange: (event) => seek(parseFloat(event.target.value)),
  });
  const clock = el("div", {class: "time"}, [
    `${position().toFixed(1)} / ${state.duration.toFixed(1)} s`,
  ]);
  const play = el("button", {onclick: toggle}, [state.playing ? "pause" : "play"]);
  const transport = el("div", {class: "transport"}, [play, slider, clock]);
  refs = {slider, clock, play};

  const scaleBlocks = state.scales.map((scale) => {
    const rows = ["A", "B"].map((side) => {
      const options = [];
      for (let value = scale.min; value <= scale.max; value += 1) {
        const chosen = answer.ratings[side][scale.key] === value;
        const label = (scale.labels && scale.labels[String(value)])
          ? `${value} · ${scale.labels[String(value)]}` : String(value);
        options.push(el("button", {
          class: chosen ? "on" : "",
          onclick: () => { answer.ratings[side][scale.key] = value; paint(); },
        }, [label]));
      }
      return el("div", {class: "row"}, [
        el("div", {class: "who"}, [side]),
        el("div", {class: "opts"}, options),
      ]);
    });
    return el("div", {class: "scale"}, [
      el("div", {class: "q"}, [scale.prompt]), ...rows,
    ]);
  });

  const preference = el("div", {class: "scale pref"}, [
    el("div", {class: "q"}, ["Which do you prefer overall?"]),
    el("div", {class: "row"}, [
      el("div", {class: "who"}, [""]),
      el("div", {class: "opts"}, ["A", "tie", "B"].map((choice) => el("button", {
        class: answer.preference === choice ? "on" : "",
        onclick: () => { answer.preference = choice; paint(); },
      }, [choice === "tie" ? "no preference" : choice]))),
    ]),
  ]);

  const last = state.index === state.trials.length - 1;
  const advance = el("button", {
    disabled: complete(trial.trial_id) ? null : "disabled",
    onclick: last ? submit : () => { state.index += 1; enter(); },
  }, [last ? "finish and submit" : "next trial"]);

  root.replaceChildren(
    el("div", {class: "panel"}, [
      el("div", {class: "request"}, ["The request was: "]),
      el("div", {class: "request"}, [el("em", {}, [trial.request])]),
      switcher, transport,
      el("div", {class: "hint"}, [
        "keys: 1 = A, 2 = B, 3 = original, space = play/pause. " +
        "Both clips run continuously on the same clock, so switching never " +
        "moves the playhead.",
      ]),
    ]),
    el("div", {class: "panel"}, [...scaleBlocks, preference]),
    el("div", {class: "panel foot"}, [
      el("div", {class: "hint"}, [`trial ${state.index + 1} of ${state.trials.length}`]),
      advance,
    ]),
  );
}

async function enter() {
  stop();
  if (ticker) { clearInterval(ticker); ticker = null; }
  root.replaceChildren(el("div", {class: "panel"}, ["loading audio…"]));
  try {
    await loadTrial(state.trials[state.index]);
  } catch (error) {
    fail(`could not load this trial: ${error.message}`);
    return;
  }
  paint();
  ticker = setInterval(tick, 200);
}

async function submit() {
  stop();
  if (ticker) { clearInterval(ticker); ticker = null; }
  const responses = state.trials.map((trial) => {
    const answer = state.answers.get(trial.trial_id);
    return {
      listener: state.listener,
      trial_id: trial.trial_id,
      preference: answer.preference,
      ratings: answer.ratings,
    };
  });
  root.replaceChildren(el("div", {class: "panel"}, ["submitting…"]));
  const response = await fetch("/responses", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({listener: state.listener, responses}),
  });
  const body = await response.json();
  root.replaceChildren(el("div", {class: "panel"}, [
    response.ok ? `Done — thank you. Saved as ${body.saved}.`
                : `Could not save: ${JSON.stringify(body)}`,
  ]));
}

document.addEventListener("keydown", (event) => {
  if (!state.trials.length || !state.buffers) return;
  if (event.key === "1") select("A");
  else if (event.key === "2") select("B");
  else if (event.key === "3") select("reference");
  else if (event.code === "Space") { event.preventDefault(); toggle(); }
});

async function boot() {
  const url = new URL(window.location.href);
  const wanted = url.searchParams.get("listener");
  const response = await fetch(`/session.json${wanted ? `?listener=${encodeURIComponent(wanted)}` : ""}`);
  if (!response.ok) { fail(`session unavailable: ${response.status}`); return; }
  const payload = await response.json();
  state.scales = payload.scales || [];

  if (!payload.trials) {
    sub.textContent = "choose your listener id";
    root.replaceChildren(el("div", {class: "panel"}, [
      el("div", {}, ["Who is listening?"]),
      el("div", {class: "listener-list"}, (payload.listeners || []).map((name) =>
        el("button", {onclick: () => { window.location.search = `?listener=${encodeURIComponent(name)}`; }}, [name]))),
    ]));
    return;
  }

  state.listener = payload.listener;
  state.trials = payload.trials;
  sub.textContent = `${payload.listener} — ${state.trials.length} trials, blinded`;
  await enter();
}

boot().catch((error) => fail(String(error)));
</script>
</body>
</html>
